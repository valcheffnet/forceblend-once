plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = 'com.mauro0805'
base { archivesName = 'ForceBlendOnce-neoforge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// The world processing code is shared with the Fabric build in the parent folder.
sourceSets.main.java {
    srcDir '../src/main/java'
    exclude 'com/mauro0805/forceblend/server/**'
}
sourceSets.main.resources {
    srcDir '../src/main/resources'
    exclude 'fabric.mod.json'
}

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
        }
    }
    mods {
        forceblendonce {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {
    jarJar(implementation("com.github.Querz:NBT:${project.querz_nbt_version}"))
    jarJar(implementation("org.lz4:lz4-pure-java:${project.lz4_version}"))
}

processResources {
    def props = [version: project.mod_version, neo_version: project.neo_version]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

jar {
    from('../LICENSE.txt') { rename { 'LICENSE_ForceBlendOnce' } }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
